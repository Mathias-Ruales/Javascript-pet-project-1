<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Stack Builders API Concept</title>
  </head>
  <body>
    <header>
      <h1>GitHub API Data Viewer</h1>
    </header>
    <main>
      <section class="inputs">
        <h2>Popular Repositories</h2>
        <div id="output-popular">Data will appear here...</div>

        <h2>Recently Updated</h2>
        <div id="output-recent">Data will appear here...</div>

        <h2>Total Star Count</h2>
        <div id="output-total">Data will appear here...</div>
      </section>

      <section class="buttons">
        <button id="btn-popular">Get Repos > 5 Stars</button>
        <button id="btn-recent">Get Last 5 Updated</button>
        <button id="btn-total">Get Total Stars</button>
      </section>
    </main>
  </body>
</html>
